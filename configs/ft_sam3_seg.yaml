# Hydra / OmegaConf config of ONE fine-tuning run (one dataset x one configuration A1 / A2).
# Built from the repo template sam3/train/configs/roboflow_v100/roboflow_v100_full_ft_100_images.yaml
# (commit f1647e8) with these changes only:
#   - segmentation enabled: the template's commented "segmentation" loss is used (Masks + SemanticSegCriterion;
#     the template's module path sam3.losses.loss_fns is wrong, the real one is sam3.train.loss.loss_fns)
#   - data: our COCO json of train-fit (all classes, negatives included), no repo val (FtTrainer.run_val
#     evaluates the holdout instead), num_train_workers from paths.yaml (template 10 -> RAM kill risk)
#   - model: ft_model.build_ft_model (sam3.pt loaded and checked, freezing per A1 / A2)
#   - checkpoint: saved (template skip_saving_ckpts: true), save_freq 0 = only the resume file checkpoint.pt,
#     frozen weights not saved (skip_saving_parameters)
#   - val every epoch (val_epoch_freq 1, skip_first_val false), max_epochs = epoch cap of the dataset
#   - layer-decay modifier of the image trunk removed (the trunk is frozen)
# Everything else (lr, scheduler, AdamW, clip, bf16 AMP, matcher, loss weights, transforms) = template.
# Values marked ??? are filled by ft_train.py.

paths:
  img_folder: ???            # images; COCO file_name is relative to it
  fit_ann_file: ???          # <out_root>/data_coco/<ds>_fit_coco.json
  sam3_checkpoint: ???
  run_dir: ???               # <out_root>/<ds>_<cfg>

ft:                          # read by ft_trainer.FtTrainer and ft_model.build_ft_model
  dataset: ???
  config: ???                # A1 | A2
  paths_yaml: ???
  out_root: ???
  holdout_limit: null        # null = whole holdout (smoke / preflight: a few images)
  epoch_cap: ???
  accelerator: cuda
  amp: true
  num_workers: 4
  seed: 0

seg_loss:
  _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
  matcher: ${scratch.matcher}
  o2m_weight: 2.0
  o2m_matcher:
    _target_: sam3.train.matcher.BinaryOneToManyMatcher
    alpha: 0.3
    threshold: 0.4
    topk: 4
  use_o2m_matcher_on_o2m_aux: false
  loss_fns_find:
    - _target_: sam3.train.loss.loss_fns.Boxes
      weight_dict:
        loss_bbox: 5.0
        loss_giou: 2.0
    - _target_: sam3.train.loss.loss_fns.IABCEMdetr
      weak_loss: False
      weight_dict:
        loss_ce: 20.0
        presence_loss: 20.0
      pos_weight: 10.0
      alpha: 0.25
      gamma: 2
      use_presence: True
      pos_focal: false
      pad_n_queries: 200
      pad_scale_pos: 1.0
    - _target_: sam3.train.loss.loss_fns.Masks
      focal_alpha: 0.25
      focal_gamma: 2.0
      weight_dict:
        loss_mask: 200.0
        loss_dice: 10.0
      compute_aux: false
  loss_fn_semantic_seg:
    _target_: sam3.train.loss.loss_fns.SemanticSegCriterion
    presence_head: True
    presence_loss: False
    focal: True
    focal_alpha: 0.6
    focal_gamma: 2.0
    downsample: False
    weight_dict:
      loss_semantic_seg: 20.0
      loss_semantic_presence: 1.0
      loss_semantic_dice: 30.0
  scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

train_transforms:
  - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
    transforms:
      - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
        query_filter:
          _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
      - _target_: sam3.train.transforms.point_sampling.RandomizeInputBbox
        box_noise_std: 0.1
        box_noise_max: 20
      - _target_: sam3.train.transforms.segmentation.DecodeRle
      - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
        sizes:
          _target_: sam3.train.transforms.basic.get_random_resize_scales
          size: ${scratch.resolution}
          min_size: 480
          rounded: false
        max_size:
          _target_: sam3.train.transforms.basic.get_random_resize_max_size
          size: ${scratch.resolution}
        square: true
        consistent_transform: ${scratch.consistent_transform}
      - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
        size: ${scratch.resolution}
        consistent_transform: ${scratch.consistent_transform}
      - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
      - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
        query_filter:
          _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
      - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
        mean: ${scratch.train_norm_mean}
        std: ${scratch.train_norm_std}
      - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
        query_filter:
          _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
  - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
    query_filter:
      _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut
      max_num_objects: ${scratch.max_ann_per_img}

scratch:
  enable_segmentation: True
  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: False
  scale_by_find_batch_size: True
  resolution: 1008
  consistent_transform: False
  max_ann_per_img: 200
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  hybrid_repeats: 1
  # learning rates (template, lr_scale 0.1)
  lr_scale: 0.1
  lr_transformer: ${times:8e-4,${scratch.lr_scale}}
  lr_vision_backbone: ${times:2.5e-4,${scratch.lr_scale}}
  lr_language_backbone: ${times:5e-5,${scratch.lr_scale}}
  wd: 0.1
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20
  train_batch_size: 1
  gradient_accumulation_steps: 1
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: ${scratch.enable_segmentation}

trainer:
  _target_: ft_trainer.FtTrainer
  ft: ${ft}
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: false
  max_epochs: ${ft.epoch_cap}
  accelerator: ${ft.accelerator}
  seed_value: ${ft.seed}
  val_epoch_freq: 1
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    find_unused_parameters: True
    gradient_as_bucket_view: True

  loss:
    all: ${seg_loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss
      device: ${ft.accelerator}

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        limit_ids: null
        transforms: ${train_transforms}
        load_segmentation: ${scratch.enable_segmentation}
        max_ann_per_img: 500000
        multiplier: 1
        max_train_queries: 50000
        max_val_queries: 50000
        training: true
        use_caching: False
        img_folder: ${paths.img_folder}
        ann_file: ${paths.fit_ann_file}
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
          include_negatives: true
          _partial_: true
      shuffle: True
      batch_size: ${scratch.train_batch_size}
      num_workers: ${ft.num_workers}
      pin_memory: True
      drop_last: True
      collate_fn: ${scratch.collate_fn}
    val: null

  model:
    _target_: ft_model.build_ft_model
    ft_config: ${ft.config}
    checkpoint_path: ${paths.sam3_checkpoint}

  meters: null

  optim:
    amp:
      enabled: ${ft.amp}
      amp_dtype: bfloat16
    optimizer:
      _target_: torch.optim.AdamW
    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2
    param_group_modifiers: null
    options:
      lr:
        - scheduler:            # transformer, scoring, segmentation head (default group)
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:            # image backbone (trunk frozen; neck convs trained in A2)
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.vision_backbone.*'
        - scheduler:            # text backbone (encoder frozen; resizer trained in A2)
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.language_backbone.*'
      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${paths.run_dir}/resume
    save_freq: 0
    skip_saving_parameters: ???      # frozen groups (ft_model.frozen_patterns)

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${paths.run_dir}/train_log/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer: null
    log_dir: ${paths.run_dir}/train_log
    log_freq: 50
